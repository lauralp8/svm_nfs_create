# ============================================================================
# CONFIGURACIÓN PARA CREAR SVM CON SERVICIO NFS USANDO API REST DE ONTAP
# ============================================================================

# Configuración del clúster
cluster:
  host: cluster1.demo.netapp.com
  username: admin
  password: Netapp1!

# Configuración de la SVM NFS
svm: 
  name: svm_nfs_cluster1
  ipspace: Default
  aggregate: cluster1_01_SSD_1
  language: c.utf_8
  security_style: unix

  # Parámetros de modificación
  aggr_list:
    - cluster1_01_SSD_1
    - cluster1_02_SSD_1
  is_space_reporting_logical: true
  is_space_enforcement_logical: true

  # Protocolos permitidos
  protocols:
    cifs: false
    nfs: true
    ndmp: true
    s3: false
    fcp: false
    iscsi: false

  # Configuración del servicio NFS
  nfs_v3_enabled: true
  nfs_v40_enabled: true
  nfs_v41_enabled: true
  nfs_v41_pnfs_enabled: true

  # Configuración de export policy
  export_policy_name: rhoso

  # Configuración de export policy rules
  # Cada policy puede tener múltiples reglas con diferentes atributos
  export_policy_rules:
    # Policy 1: default (permite acceso total desde cualquier IP)
    - policy_name: default
      rules:
        - clientmatch: 0.0.0.0/0
          rorule: any
          rwrule: any
          superuser: any
          protocols:
            - nfs
            - nfs3
            - nfs4
          ruleindex: 1
    
    # Policy 2: rhoso (acceso restringido desde subred específica)
    - policy_name: rhoso
      rules:
        - clientmatch: 192.168.25.0/24
          rorule: sys
          rwrule: any
          # superuser: none  # Puedes omitir si no quieres superuser
          protocols:
            - nfs
            - nfs3
            - nfs4
          # ruleindex: 1 # Puedes omitir si no es necesario

  # Configuración de Network Interfaces (LIFs)
  # Cada LIF puede tener atributos completamente diferentes
  network_interfaces:
    # LIF 1: Interfaz de datos NFS
    - name: lif1
      role: data
      data_protocol: nfs
      home_node: cluster1-01
      home_port: e0c
      address: 192.168.0.131
      netmask: 255.255.255.0
      firewall_policy: data
      auto_revert: false
    
    # LIF 2: Interfaz de management
    - name: UFCREATEYA
      service_policy: default-management
      address: 192.168.0.134
      netmask: 255.255.255.0
      home_node: cluster1-01
      home_port: e0e
      broadcast_domain: Default
      status_admin: up
      failover_policy: system-defined
      firewall_policy: mgmt
      auto_revert: false