# ============================================================================
# CONFIGURACIÓN PARA CREAR SVM CON SERVICIO NFS USANDO API REST DE ONTAP
# ============================================================================

# CONFIGURACIÓN DE CONEXIÓN AL CLUSTER
cluster:
  host: cluster1.demo.netapp.com         
  username: admin
  password: Netapp1!

# CONFIGURACIÓN DE LA SVM NFS
svm: 
  name: SVMv2-ES00384-CINDER_BCN_NAS01-NAS
  ipspace: Default
  aggregate: aggr1_BCNAFF01_01
  language: c.utf_8
  security_style: unix
  rootvolume: SVMv2-ES00384-C_BCN_NAS01-NAS_root

  # Parámetros de modificación
  aggr_list:
    - aggr1_BCNAFF01_02
    - aggr1_BCNAFF01_01
  is_space_reporting_logical: true
  is_space_enforcement_logical: true

  # Protocolos permitidos
  protocols:
    cifs: false
    nfs: true
    ndmp: true
    s3: false
    fcp: false
    iscsi: false

  # Configuración del servicio NFS
  nfs_v3_enabled: true
  nfs_v40_enabled: true
  nfs_v41_enabled: true
  nfs_v41_pnfs_enabled: true

  # Configuración de export policy
  export_policy_name: cinder

  # Configuración de export policy rules
  export_policy_rules:
    # Policy 1: default 
    - policy_name: default
      rules:
        - clientmatch: 0.0.0.0/0
          rorule: any
          rwrule: any
          superuser: any
          protocols:
            - nfs
            - nfs3
            - nfs4
          ruleindex: 1
    
    # Policy 2: cinder 
    - policy_name: cinder
      rules:
        - clientmatch: 192.168.25.0/24
          rorule: sys
          rwrule: any
          protocols:
            - nfs
            - nfs3
            - nfs4
          # ruleindex: 1 # Opcional
          # superuser: sys # Opcional 

  # CONFIGURACIÓN NETWORK INTERFACES (LIFs)
  network_interfaces:
    # LIF 1: Interfaz de datos NFS
    - name: CINDER_BCN_NAS01_NFS_LIF0
      role: data
      data_protocol: nfs
      home_node: BCNAFF01-01
      home_port: a0a-1009
      address: 192.168.23.40
      netmask: 255.255.255.0
      auto_revert: false

    # LIF 1: Interfaz de datos NFS
    - name: _BCN_NAS01_NFS_LIF1
      role: data
      data_protocol: nfs
      home_node: BCNAFF01-01
      home_port: a0a-1010
      address: 192.168.25.40
      netmask: 255.255.255.0
      auto_revert: false
  
    # LIF 2: Interfaz de management
    #- name: CINDER_BCN_NAS01_MGMT_LIF2
    #  service_policy: default-management
    #  address: 192.168.25.39  
    #  netmask: 255.255.255.0
    #  home_node: VLDAFF01-01
    #  home_port: a0a-1010
