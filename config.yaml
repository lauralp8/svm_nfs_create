# ============================================================================
# CONFIGURACIÓN PARA CREAR SVM CON SERVICIO NFS USANDO API REST DE ONTAP
# ============================================================================

# CONFIGURACIÓN DE CONEXIÓN AL CLUSTER
cluster:
  host: cluster1.demo.netapp.com         
  username: admin
  password: Netapp1!

# CONFIGURACIÓN DE LA SVM NFS
svm: 
  name: PRUEBA_NFS_SVM
  ipspace: Default
  aggregate: cluster1_01_SSD_1
  language: c.utf_8
  security_style: unix
  rootvolume: PRUEBA_NFS_SVM_root

  # Parámetros de modificación
  aggr_list:
    - cluster1_01_SSD_1
    - cluster1_02_SSD_1
  is_space_reporting_logical: true
  is_space_enforcement_logical: true

  # Protocolos permitidos
  protocols:
    cifs: false
    nfs: true
    ndmp: true
    s3: false
    fcp: false
    iscsi: false

  # Configuración del servicio NFS
  nfs_v3_enabled: true
  nfs_v40_enabled: true
  nfs_v41_enabled: true
  nfs_v41_pnfs_enabled: true

  # Configuración de export policy
  export_policy_name: rhoso

  # Configuración de export policy rules
  export_policy_rules:
    # Policy 1: default 
    - policy_name: default
      rules:
        - clientmatch: 0.0.0.0/0
          rorule: any
          rwrule: any
          superuser: any
          protocols:
            - nfs
            - nfs3
            - nfs4
          ruleindex: 1
    
    # Policy 2: rhoso 
    - policy_name: rhoso
      rules:
        - clientmatch: 192.168.0.0/24
          rorule: sys
          rwrule: any
          protocols:
            - nfs
            - nfs3
            - nfs4
          # ruleindex: 1 # Opcional
          # superuser: sys # Opcional 

  # CONFIGURACIÓN NETWORK INTERFACES (LIFs)
  network_interfaces:
    # LIF 1: Interfaz de datos NFS
    - name: prueba_nfs_svm_LIF1
      role: data
      data_protocol: nfs
      home_node: cluster1-01
      home_port: e0e
      address: 192.168.0.218
      netmask: 255.255.255.0
      auto_revert: false

    # LIF 1: Interfaz de datos NFS
    - name: prueba_nfs_svm_LIF2
      role: data
      data_protocol: nfs
      home_node: cluster1-01
      home_port: e0e
      address: 192.168.0.219
      netmask: 255.255.255.0
      auto_revert: false
  
    # LIF 2: Interfaz de management
    - name: prueba_nfs_svm_LIF_MANAGEMENT
      service_policy: default-management
      address: 192.168.0.220  
      netmask: 255.255.255.0
      home_node: cluster1-01
      home_port: e0e
      broadcast_domain: Default
      status_admin: up
      auto_revert: false
